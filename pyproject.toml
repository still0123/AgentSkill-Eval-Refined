[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentskill-eval"
version = "0.3.0rc1"
description = "Reproducible evaluation and regression analysis for Agent Skills."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
  "click>=8.1.8,<8.2",
  "jsonschema>=4.23,<5",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.20,<0.21",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12,<7",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
agentskill-eval = "agentskill_eval_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = [
  "apps/cli/agentskill_eval_cli",
  "apps/worker/agentskill_eval_worker",
  "packages/contracts/agentskill_eval_contracts",
  "packages/runner_adapters/agentskill_eval_runner_adapters",
  "packages/experiment/agentskill_eval_experiment",
  "packages/trace_intelligence/agentskill_eval_trace_intelligence",
  "packages/benchmark_gen/agentskill_eval_benchmark_gen",
  "packages/skill_optimizer/agentskill_eval_skill_optimizer",
  "packages/real_evidence/agentskill_eval_real_evidence",
  
  "packages/scenarios/agentskill_eval_scenarios",
]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.agentskill-eval",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/apps/web/coverage",
  "/apps/web/dist",
  "/apps/web/node_modules",
  "/**/*.tsbuildinfo",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = [
  "agentskill_eval_benchmark_gen",
  "agentskill_eval_cli",
  "agentskill_eval_contracts",
  "agentskill_eval_experiment",
  "agentskill_eval_trace_intelligence",
  "agentskill_eval_runner_adapters",
  "agentskill_eval_skill_optimizer",
  "agentskill_eval_real_evidence",
  "agentskill_eval_scenarios",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [".agentskill-eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  # Keep public annotations directly valid for the minimum supported Python 3.9.
  "UP006",
  "UP035",
  "UP037",
  "UP045",
]

[tool.ruff.lint.isort]
known-first-party = [
  "agentskill_eval_benchmark_gen",
  "agentskill_eval_cli",
  "agentskill_eval_contracts",
  "agentskill_eval_experiment",
  "agentskill_eval_trace_intelligence",
  "agentskill_eval_runner_adapters",
  "agentskill_eval_skill_optimizer",
  "agentskill_eval_real_evidence",
  "agentskill_eval_scenarios",
]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unreachable = true
