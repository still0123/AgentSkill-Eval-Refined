[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentskill-eval"
version = "0.1.0"
description = "Reproducible evaluation and regression analysis for Agent Skills."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
agentskill-eval = "agentskill_eval_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = [
  "apps/cli/agentskill_eval_cli",
  "apps/worker/agentskill_eval_worker",
  "packages/contracts/agentskill_eval_contracts",
  "packages/runner_adapters/agentskill_eval_runner_adapters",
  "packages/experiment/agentskill_eval_experiment",
  "packages/trace_intelligence/agentskill_eval_trace_intelligence",
  "packages/benchmark_gen/agentskill_eval_benchmark_gen",
  "packages/skill_optimizer/agentskill_eval_skill_optimizer",
  "packages/mcp_lab/agentskill_eval_mcp_lab",
  "packages/memory_rag_lab/agentskill_eval_memory_rag_lab",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = [
  "agentskill_eval_benchmark_gen",
  "agentskill_eval_cli",
  "agentskill_eval_contracts",
  "agentskill_eval_experiment",
  "agentskill_eval_trace_intelligence",
  "agentskill_eval_runner_adapters",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  # Keep public annotations directly valid for the minimum supported Python 3.9.
  "UP006",
  "UP035",
  "UP037",
  "UP045",
]

[tool.ruff.lint.isort]
known-first-party = [
  "agentskill_eval_benchmark_gen",
  "agentskill_eval_cli",
  "agentskill_eval_contracts",
  "agentskill_eval_experiment",
  "agentskill_eval_trace_intelligence",
  "agentskill_eval_runner_adapters",
]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unreachable = true
