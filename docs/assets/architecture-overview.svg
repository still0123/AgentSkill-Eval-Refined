  <rect x="510" y="200" width="300" height="50" rx="6" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1.5"/>
  <text x="660" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#16A085">Agent 执行</text>
  <text x="660" y="238" text-anchor="middle" font-size="10" fill="#666">查看代码 → 修改 → 运行测试</text>

  <line x1="300" y1="250" x2="300" y2="280" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="250" x2="660" y2="280" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
