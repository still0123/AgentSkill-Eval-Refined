  <line x1="480" y1="595" x2="480" y2="612" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="280" y="617" width="400" height="28" rx="14" fill="#FADBD8" stroke="#E74C3C" stroke-width="1.5"/>
  <text x="480" y="636" text-anchor="middle" font-size="11" font-weight="bold" fill="#C0392B">无增益 → 系统阻止发布，而非美化结果</text>
  <rect x="708" y="650" width="232" height="22" rx="4" fill="#FEF9E7" stroke="#F1C40F"/>
  <text x="824" y="665" text-anchor="middle" font-size="9" font-weight="bold" fill="#7D6608">SIMULATED DEMO 不可冒充真实证据</text>
