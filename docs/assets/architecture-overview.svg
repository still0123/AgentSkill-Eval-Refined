  <rect x="510" y="285" width="300" height="50" rx="6" fill="#F4F6F7" stroke="#95A5A6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="660" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#2C3E50">Patch + Trace + 费用</text>
  <text x="660" y="322" text-anchor="middle" font-size="10" fill="#777">SHA-256 不可变证据</text>

  <line x1="300" y1="335" x2="300" y2="360" stroke="#555" stroke-width="1.5"/>
