  <text x="480" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">同一个 Bug Fix Case</text>
  <line x1="480" y1="101" x2="480" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="150" y="125" width="300" height="42" rx="6" fill="#ECF0F1" stroke="#95A5A6" stroke-width="1.5"/>
