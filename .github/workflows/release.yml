name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, attest and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
      - name: Verify source
        run: |
          python -m ruff check .
          python -m mypy apps packages
          python -m pytest
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          from packaging.version import Version
          from agentskill_eval_cli import __version__

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v").replace("-rc.", "rc")
          if Version(tag) != Version(__version__):
              raise SystemExit(f"tag {tag} does not match package {__version__}")
          PY
      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist
      - name: Verify wheel-only Portfolio Demo
        run: |
          python -m venv /tmp/agentskill-eval-release
          /tmp/agentskill-eval-release/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/agentskill-eval-release/bin/agentskill-eval demo run \
            --workspace /tmp/portfolio-demo \
            --bootstrap-resamples 100
          /tmp/agentskill-eval-release/bin/agentskill-eval demo verify \
            --workspace /tmp/portfolio-demo
      - name: Assemble release assets
        run: |
          tar -cf dist/agentskill-eval-refined-demo-evidence.tar \
            -C /tmp/portfolio-demo \
            experiment-report.json \
            experiment-report.html \
            paired-results.json \
            evidence-index.json \
            audit-bundle.tar \
            skill-diff.patch \
            trace
          cp docs/assets/architecture-overview.svg dist/
          cp docs/assets/dashboard-simulated.png dist/
          cp docs/five-minute-demo.md dist/
          shasum -a 256 dist/* > dist/SHA256SUMS
      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/agentskill-eval-refined-demo-evidence.tar
      - name: Resolve release notes
        id: release_notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME/-rc./-rc}.md"
          test -f "$notes"
          echo "path=$notes" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: AgentSkill-Eval Refined Portfolio Release ${{ github.ref_name }}
          prerelease: true
          body_path: ${{ steps.release_notes.outputs.path }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/agentskill-eval-refined-demo-evidence.tar
            dist/architecture-overview.svg
            dist/dashboard-simulated.png
            dist/five-minute-demo.md
            dist/SHA256SUMS
