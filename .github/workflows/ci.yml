name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality, tests and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy apps packages
      - name: Pytest
        run: python -m pytest
      - name: Demo verification
        run: |
          agentskill-eval demo run --workspace /tmp/portfolio-demo
          agentskill-eval demo verify --workspace /tmp/portfolio-demo
          agentskill-eval demo run --workspace /tmp/portfolio-demo-repeat
          agentskill-eval demo verify --workspace /tmp/portfolio-demo-repeat
          python - <<'PY'
          import json
          from pathlib import Path
          ws = Path("/tmp/portfolio-demo")
          repeat_ws = Path("/tmp/portfolio-demo-repeat")

          # Check evidence pack files exist
          required = ["experiment-report.json", "experiment-report.html",
                       "paired-results.json", "evidence-index.json",
                       "audit-bundle.tar", "skill-diff.patch"]
          for f in required:
              assert (ws / f).is_file(), f"missing evidence pack file: {f}"

          # Verify no invalid runs
          paired = json.loads((ws / "paired-results.json").read_text())
          assert paired.get("invalid_runs", 1) == 0, "demo must have 0 invalid runs"
          assert paired.get("simulated") is True, "demo must be marked simulated"

          # Verify evidence class
          index = json.loads((ws / "evidence-index.json").read_text())
          assert index.get("evidence_class") == "SIMULATED_DEMO", "wrong evidence class"
          assert set(index["hashes"]) == {
              "dataset_sha256", "skill_sha256", "runner_sha256", "environment_sha256"
          }

          # Repeated offline runs must produce the same domain result and input hashes.
          repeated = json.loads((repeat_ws / "paired-results.json").read_text())
          paired.pop("experiment_id")
          repeated.pop("experiment_id")
          assert paired == repeated, "repeated demo result drifted"
          repeated_index = json.loads((repeat_ws / "evidence-index.json").read_text())
          assert index["hashes"] == repeated_index["hashes"], "input lineage hashes drifted"

          # Verify HTML contains SIMULATED marker
          html = (ws / "experiment-report.html").read_text()
          assert "SIMULATED" in html, "HTML report must contain SIMULATED marker"

          print(f"demo verification passed: {paired.get('logical_runs')} runs, "
                f"0 invalid, evidence class={index.get('evidence_class')}")
          PY
      - name: Export and validate public schemas
        run: |
          agentskill-eval schema export /tmp/agentskill-eval-schema.json
          python - <<'PY'
          import json
          from pathlib import Path

          bundle = json.loads(Path("/tmp/agentskill-eval-schema.json").read_text())
          schemas = bundle["schemas"]
          if bundle["schema_version"] != "ase/v1alpha1":
              raise SystemExit("unexpected schema bundle version")
          if not schemas or len(schemas) != len(set(schemas)):
              raise SystemExit("empty or duplicate public schema names")
          print(f"validated {len(schemas)} public schemas")
          PY
      - name: Build release distributions
        run: python -m build --wheel --sdist
      - name: Verify installed wheel layout
        run: |
          python -m venv /tmp/agentskill-eval-wheel
          /tmp/agentskill-eval-wheel/bin/python -m pip install dist/*.whl
          /tmp/agentskill-eval-wheel/bin/agentskill-eval version
          /tmp/agentskill-eval-wheel/bin/python - <<'PY'
          import agentskill_eval_benchmark_gen
          import agentskill_eval_cli
          import agentskill_eval_contracts
          import agentskill_eval_experiment
          import agentskill_eval_real_evidence
          import agentskill_eval_runner_adapters
          import agentskill_eval_skill_optimizer
          import agentskill_eval_trace_intelligence
          import agentskill_eval_scenarios
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  dashboard:
    name: Dashboard quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Show Node and pnpm versions
        run: |
          node --version
          pnpm --version
      - name: Install locked Dashboard dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: apps/web/dist
          if-no-files-found: error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
