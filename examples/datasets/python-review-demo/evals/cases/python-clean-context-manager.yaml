id: python-clean-context-manager
title: Managed file reader
description: Negative control with correct resource cleanup.
input:
  prompt: |
    Review the production code in the current repository for one concrete defect. Report
    `DEFECT_FOUND: <CATEGORY>` only with reachable evidence. Otherwise report exactly
    `NO_ACTIONABLE_DEFECT` and explain why the likely resource concern is already handled.
    Do not modify files.
context:
  repo_fixture: evals/fixtures/repos/python-clean-context-manager
expect:
  must_contain: ["NO_ACTIONABLE_DEFECT"]
  must_not_contain: ["DEFECT_FOUND"]
  exit_code: 0
