dataset: dataset.yaml
agent: deterministic-mock-agent
model: no-model
seed: 20240713
timeout_seconds: 5
token_budget: 1000
cost_budget_usd: 0
simulated: true
failure_injection:
  - {tool: unstable_service, kind: transient, fail_attempts: 1, latency_ms: 10}
plans:
  document-lookup:
    without_guidance:
      actions:
        - {tool: query_database, arguments: {query_name: ticket_count}}
      final_response: No relevant document found.
      token_count: 20
      cost_usd: 0
    with_guidance:
      actions:
        - {tool: search_documents, arguments: {query: MCP guide}}
        - {tool: get_document, arguments: {document_id: doc-1}}
      final_response: MCP guide found in doc-1.
      token_count: 24
      cost_usd: 0
  transient-recovery:
    without_guidance:
      actions:
        - {tool: unstable_service, arguments: {}}
      final_response: Service failed.
      token_count: 10
      cost_usd: 0
    with_guidance:
      actions:
        - {tool: unstable_service, arguments: {}, max_retries: 1}
      final_response: Service is healthy after bounded retry.
      token_count: 14
      cost_usd: 0
