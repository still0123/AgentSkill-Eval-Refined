name: offline-mcp-evaluation-demo
simulated: true
cases:
  - case_id: document-lookup
    task: Find and read the MCP guide document.
    available_tools: &tools
      - name: search_documents
        description: Search deterministic documents.
        input_schema:
          type: object
          properties:
            query: {type: string, minLength: 1}
          required: [query]
          additionalProperties: false
        side_effect: read_only
      - name: get_document
        description: Read one deterministic document.
        input_schema:
          type: object
          properties:
            document_id: {type: string, enum: [doc-1, doc-2]}
          required: [document_id]
          additionalProperties: false
        side_effect: read_only
      - name: query_database
        description: Run a named read-only query.
        input_schema:
          type: object
          properties:
            query_name: {type: string, enum: [ticket_count, open_tickets]}
          required: [query_name]
          additionalProperties: false
        side_effect: read_only
      - name: create_ticket
        description: Create a ticket.
        input_schema:
          type: object
          properties:
            title: {type: string, minLength: 1}
            idempotency_key: {type: string, minLength: 1}
            api_token: {type: string}
          required: [title, idempotency_key]
          additionalProperties: false
        side_effect: mutating
        sensitive_parameters: [api_token]
      - name: update_ticket
        description: Update a ticket.
        input_schema:
          type: object
          properties:
            ticket_id: {type: string}
            status: {type: string, enum: [open, closed]}
            idempotency_key: {type: string, minLength: 1}
          required: [ticket_id, status, idempotency_key]
          additionalProperties: false
        side_effect: mutating
      - name: unstable_service
        description: Failure-injection target.
        input_schema: {type: object, properties: {}, additionalProperties: false}
        side_effect: read_only
      - name: unavailable_tool
        description: Always unavailable.
        input_schema: {type: object, properties: {}, additionalProperties: false}
        side_effect: read_only
    expected_tools: [search_documents, get_document]
    forbidden_tools: [create_ticket, update_ticket, unavailable_tool]
    required_parameters:
      - {tool: search_documents, parameters: [query]}
      - {tool: get_document, parameters: [document_id]}
    parameter_constraints:
      - {tool: search_documents, parameter: query, rule: equals, value: MCP guide}
    allowed_sequences:
      - {tools: [search_documents, get_document]}
    forbidden_sequences:
      - {tools: [get_document, search_documents]}
    expected_recovery: []
    max_tool_calls: 3
    side_effect_policy:
      allow_mutating: false
      allow_destructive: false
      require_confirmation: true
    oracle:
      final_status: success
      required_response_contains: [MCP guide]
    independence_group: documents
    provenance: {source: hand-authored-demo, author: AgentSkill-Eval, version: "1"}
    simulated: true
  - case_id: transient-recovery
    task: Read the unstable service and recover from one transient failure.
    available_tools: *tools
    expected_tools: [unstable_service]
    forbidden_tools: [create_ticket, update_ticket, unavailable_tool]
    required_parameters: []
    parameter_constraints: []
    allowed_sequences:
      - {tools: [unstable_service]}
    forbidden_sequences: []
    expected_recovery:
      - {tool: unstable_service, failure: transient, action: retry, max_retries: 1}
    max_tool_calls: 2
    side_effect_policy:
      allow_mutating: false
      allow_destructive: false
      require_confirmation: true
    oracle:
      final_status: success
      required_response_contains: [healthy]
    independence_group: recovery
    provenance: {source: hand-authored-demo, author: AgentSkill-Eval, version: "1"}
    simulated: true
