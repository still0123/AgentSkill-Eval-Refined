    regression_test_paths: [tests/test_flow.py]
    test_command:
      - "${PYTHON}"
      - -m
      - pytest
      - -q
      - tests/test_flow.py::test_throttle
    alternative_patch: |
      diff --git a/funcy/flow.py b/funcy/flow.py
      --- a/funcy/flow.py
      +++ b/funcy/flow.py
      @@ -197,7 +197,7 @@ def limit_error_rate(fails, timeout, exception=ErrorRateExceeded):
       def throttle(period):
           """Allows only one run in a period, the rest is skipped"""
           if isinstance(period, timedelta):
      -        period = timedelta.total_seconds()
      +        period = period / timedelta(seconds=1)

