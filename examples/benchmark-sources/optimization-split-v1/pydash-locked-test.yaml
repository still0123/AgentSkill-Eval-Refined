      - -q
      - tests/test_predicates.py::test_in_range
    alternative_patch: |
      diff --git a/src/pydash/predicates.py b/src/pydash/predicates.py
      --- a/src/pydash/predicates.py
      +++ b/src/pydash/predicates.py
      @@ -390,7 +390,9 @@ def in_range(value: t.Any, start: t.Any = 0, end: t.Any = None) -> bool:
