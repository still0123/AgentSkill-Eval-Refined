schema_version: ase/benchmark-split-plan/v1alpha2
name: real-python-bug-fix-small
version: "2026.07.14.3"
source_spec: cross-repository-generation.example.yaml
repository_isolation: adaptive_vs_holdout
locked_test_visibility: public_high_contamination
claim_limit: >-
  Twelve public Git-history cases from two repository exposure cohorts and twelve independent defect
  families. Locked cases are one-shot workflow evidence but remain public and high-contamination;
  this small benchmark does not support general Agent performance claims.
splits:
  train:
    - more-itertools-islice-release
  validation_search:
    - more-itertools-last-reversed-none
    - more-itertools-sample-strict-counts
  regression_dev:
    - more-itertools-split-after-empty-tail
  validation_confirm:
    - cachetools-cachedmethod-autospec
    - cachetools-cachedmethod-bound-key
    - cachetools-cachedmethod-self-key
    - cachetools-ttl-boundary-expiration
  locked_test:
    - cachetools-hashkey-pickle
    - cachetools-lru-missing-item
    - cachetools-lru-popitem-context
    - cachetools-missing-oversized-value
